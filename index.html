<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OurShelves</title>
    <meta name="description" content="我們的書架：兩個人的閱讀與觀影心得紀錄。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&family=Inter:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-view="home">

    <header class="site-header">
        <h1 class="site-title"><a href="#/">Our Shelves</a></h1>
        <nav class="site-nav" aria-label="網站導覽">
            <a href="#/" data-nav-link="home">Home</a>
            <a href="#/about" data-nav-link="about">Picks</a>
            <a href="#/genres" data-nav-link="genres">Genres</a>
            <a href="#/donate" data-nav-link="donate">Donate♡</a>
        </nav>
        <button class="auth-btn" type="button" data-auth hidden>登入</button>
        <button class="ham-btn" type="button" aria-label="選單" aria-expanded="false" aria-controls="mob-nav">☰</button>
    </header>
    <nav class="mob-nav" id="mob-nav" hidden aria-label="手機選單">
        <a href="#/" data-nav-link="home">Home</a>
        <a href="#/about" data-nav-link="about">Picks</a>
        <a href="#/genres" data-nav-link="genres">Genres</a>
        <a href="#/donate" data-nav-link="donate">Donate♡</a>
    </nav>

    <main id="app" class="panel"></main>

    <footer class="site-footer">
        <span>The Shelves Of Ourselves</span>
        <span>謝依軒 沈靖敏</span>
        <span id="year"></span>
    </footer>

    <dialog id="entry-dialog" aria-labelledby="dialog-title">
        <form id="entry-form" method="dialog">
            <h2 id="dialog-title">新增一筆</h2>
            <div class="form-grid">
                <label class="full">
                    誰的書架
                    <select name="owner">
                        <option value="queenie">queenie</option>
                        <option value="jnmin">Jnmin</option>
                    </select>
                </label>
                <label>
                    類型
                    <select name="type">
                        <option value="book">書</option>
                        <option value="movie">電影</option>
                    </select>
                </label>
                <label>
                    評分
                    <select name="rating">
                        <option value="5">★★★★★</option>
                        <option value="4">★★★★☆</option>
                        <option value="3">★★★☆☆</option>
                        <option value="2">★★☆☆☆</option>
                        <option value="1">★☆☆☆☆</option>
                    </select>
                </label>
                <label class="full">
                    標題
                    <input name="title" required maxlength="80" autocomplete="off">
                </label>
                <label>
                    作者／導演
                    <input name="creator" maxlength="60" autocomplete="off">
                </label>
                <label>
                    日期
                    <input type="date" name="date">
                </label>
                <label class="full">
                    封面圖片網址（選填）
                    <input type="url" name="cover" placeholder="https://" autocomplete="off">
                </label>
                <label>
                    分類（選填）
                    <input name="genre" maxlength="40" placeholder="例：小說、散文、科幻⋯" autocomplete="off">
                </label>
                <label class="full">
                    心得
                    <textarea name="review" rows="6"></textarea>
                </label>
                <label class="full">
                    摘錄
                    <textarea name="quote" rows="2"></textarea>
                </label>
            </div>
            <div class="dialog-actions">
                <button type="button" class="btn btn--ghost" data-cancel>取消</button>
                <button type="submit" class="btn">儲存</button>
            </div>
        </form>
    </dialog>

    <dialog id="login-dialog" aria-labelledby="login-title">
        <form id="login-form" method="dialog">
            <h2 id="login-title">登入</h2>
<div class="form-grid">
                <label class="full">
                    Email
                    <input type="email" name="email" required autocomplete="username">
                </label>
                <label class="full">
                    密碼
                    <input type="password" name="password" autocomplete="current-password">
                </label>
            </div>
            <p class="dialog-note" id="login-status" role="status"></p>
            <p class="dialog-note">還沒設定密碼或忘記密碼？<button type="button" class="link-btn" data-magic>寄登入連結到這個 email</button></p>
            <div class="dialog-actions">
                <button type="button" class="btn btn--ghost" data-cancel>取消</button>
                <button type="submit" class="btn">登入</button>
            </div>
        </form>
    </dialog>

    <dialog id="account-dialog" aria-labelledby="account-title">
        <form id="account-form" method="dialog">
            <h2 id="account-title">帳號</h2>
            <p class="dialog-note" id="account-email"></p>
            <div class="form-grid">
                <label>
                    新密碼
                    <input type="password" name="password" required minlength="6" autocomplete="new-password">
                </label>
                <label>
                    再輸入一次
                    <input type="password" name="confirm" required minlength="6" autocomplete="new-password">
                </label>
            </div>
            <p class="dialog-note" id="account-status" role="status"></p>
            <div class="dialog-actions">
                <button type="button" class="btn btn--ghost" data-signout>登出</button>
                <button type="button" class="btn btn--ghost" data-cancel>關閉</button>
                <button type="submit" class="btn">設定密碼</button>
            </div>
        </form>
    </dialog>

    <div id="loader" aria-hidden="true">
        <div class="loader-case">
            <div class="loader-row">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="loader-row">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="loader-row">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="loader-row">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <dialog id="add-owner-dialog" aria-labelledby="add-owner-title">
        <form id="add-owner-form" method="dialog">
            <h2 id="add-owner-title">新增書架主人</h2>
            <div class="form-grid">
                <label class="full">
                    網址 ID（只能用英文小寫、數字、連字號）
                    <input name="owner_id" required maxlength="40" pattern="[a-z0-9\-]+" placeholder="例：alice" autocomplete="off">
                </label>
                <label class="full">
                    顯示名稱
                    <input name="name" required maxlength="40" autocomplete="off">
                </label>
                <label class="full">
                    簡介（選填）
                    <textarea name="bio" rows="3"></textarea>
                </label>
            </div>
            <p class="dialog-note" id="add-owner-status" role="status"></p>
            <div class="dialog-actions">
                <button type="button" class="btn btn--ghost" data-cancel>取消</button>
                <button type="submit" class="btn">新增</button>
            </div>
        </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
